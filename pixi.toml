[workspace]
name = "local-inference-bench"
channels = ["https://prefix.dev/inference-extensions", "conda-forge"]
platforms = [
  "osx-arm64",
  { platform = "linux-64", cuda = "12.9", glibc = "2.34" },
  { platform = "linux-aarch64", cuda = "12.9", glibc = "2.34" },
]
preview = ["pixi-build"]

[package]
name = "local-inference-bench"
[package.build.backend]
name = "pixi-build-python"
version = "*"
[package.host-dependencies]
python = ">=3.14"
hatchling = "*"
uv = "*"

[dependencies]
local-inference-bench = { path = "." }
"llama.cpp" = "*"
openssl = ">=3.6.3,<4"

[feature.laguna.dependencies]
"llama.cpp" = { version = "*", build = "laguna*", channel = "https://prefix.dev/inference-extensions" }

[feature.inkling.dependencies]
"llama.cpp" = { version = "*", build = "unsloth_inkling_*", channel = "https://prefix.dev/inference-extensions" }

[feature.vanilla.dependencies]
"llama.cpp" = { version = "*", channel = "conda-forge" }

[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
mypy = "*"
[feature.test.tasks]
test = "pytest"
test-coverage = "pytest --cov=local_inference_bench --cov-report=xml --cov-report=term-missing"

[feature.build.dependencies]
python = "*"
hatchling = "*"
python-build = "*"
twine = ">=6"
[feature.build.tasks]
build-wheel = "python -m build --no-isolation ."
check-wheel = "twine check dist/*"

[feature.lint.dependencies]
lefthook = "*"
ruff = "*"
prettier = "*"
taplo = "*"
pre-commit-hooks = "*"
typos = "*"
zizmor = "*"
[feature.lint.tasks]
pre-commit-install = "lefthook install"
lint = "lefthook run pre-commit --all-files"

[feature.py314.dependencies]
python = "3.14.*"

[environments]
default = ["test", "build", "lint"]
py314 = ["py314", "test"]
inkling = { features = [
  "test",
  "build",
  "lint",
  "inkling",
], solve-group = "inkling" }
laguna = { features = [
  "test",
  "build",
  "lint",
  "laguna",
], solve-group = "laguna" }
vanilla = { features = [
  "test",
  "build",
  "lint",
  "vanilla",
], solve-group = "vanilla" }
